name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
      - 'dev/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Lint, Format Check & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install Dependencies
        working-directory: ./src
        run: npm ci

      - name: Run ESLint Check
        working-directory: ./src
        run: npm run lint:check

      - name: Run Prettier Format Check
        working-directory: ./src
        run: npm run format:check

      - name: Run Unit Tests
        working-directory: ./src
        run: npm test

  build-and-push:
    name: Docker Build, Scan & Push
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/goldenowl-app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build Docker Image locally for Trivy Scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: goldenowl-app:local-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Security Scan 
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'goldenowl-app:local-scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build and Push Docker Image to DockerHub
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    name: Continuous Deployment (CD) to AWS ECS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::852544369555:role/goldenowl-github-deploy
          aws-region: ap-southeast-1


      - name: Trigger New ECS Deployment
        run: |
          aws ecs update-service \
            --cluster goldenowl-cluster \
            --service goldenowl-service \
            --force-new-deployment

